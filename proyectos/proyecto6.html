<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black">

    <section class="container mx-auto px-4 md:px-8 py-10">
        <div class="max-w-4xl mx-auto text-center">

            <h2 class="text-white text-2xl md:text-3xl font-bold font-mono pb-4">
                Universo Life Is Strange realizado con el Framework Tailwind CSS.</h2>
            <p class="text-white text-sm md:text-base  font-serif py-4">
                Está pagina se realizo para el desarollo de diseños mas complejos con el Framework Tailwind, de la saga
                Ganadora de BAFTA Life Is Strange.
            </p>

            <div class="flex flex-col gap-6 py-6 justify-center items-center">

                <div class="w-full max-w-5xl">
                    <img class="rounded-md w-full h-auto object-cover"
                        src="../imagenes/UniversoLifeIsStrange/Captura de pantalla 2025-10-17 214947.png">
                </div>

                <div class="w-full max-w-5xl">
                    <img class="rounded-md w-full h-auto object-cover"
                        src="../imagenes/UniversoLifeIsStrange/Captura de pantalla 2025-10-17 215019.png">
                </div>

                <div class="w-full max-w-5xl">
                    <img class="rounded-md w-full h-auto object-cover"
                        src="../imagenes/UniversoLifeIsStrange/Captura de pantalla 2025-10-17 215039.png">
                </div>

            </div>
        </div>

    </section>

    <section class="px-6 py-12 max-w-6xl md:py-30 mx-auto">

        <div class="text-center mb-10">
            <h2 class="text-3xl font-mono font-bold text-white">
                Tecnologias Utilizadas</h2>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-8 text-center items-center">

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/HTML5.png">
                <h3 class="text-xl font-bold text-white">HTML</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/tailwind.png">
                <h3 class="text-xl font-bold text-white">Tailwind</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/Javascript.png">
                <h3 class="text-xl font-bold text-white">Javascript</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/CSS.png">
                <h3 class="text-xl font-bold text-white">CSS</h3>
            </div>

        </div>

    </section>

</body>

</html>
