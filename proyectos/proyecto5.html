<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black">

    <section class="container mx-auto px-4 md:px-8 py-10">
        <div class="max-w-4xl mx-auto text-center">

            <h2 class="text-white text-2xl md:text-3xl font-bold font-mono pb-4">
                Leviathaner Blog.</h2>
            <p class="text-white text-sm md:text-base  font-serif py-4">
                Esté es un blog realizado con el framework Laravel en el cual se lleva la gestión de la creación,
                edición y eliminación de las publicaciones.
            </p>


            <div class="flex flex-col gap-6 py-6 justify-center items-center">

                <div class="w-full max-w-5xl">
                    <img class="rounded-md" src="../imagenes/bloglaravel/Captura de pantalla 2026-05-01 083753.png">
                </div>

                <div class="w-full max-w-5xl">
                    <img class="rounded-md" src="../imagenes/bloglaravel/Captura de pantalla 2026-05-01 083857.png">
                </div>

                <div class="w-full max-w-5xl">
                    <img class="rounded-md" src="../imagenes/bloglaravel/Captura de pantalla 2026-05-01 083955.png">
                </div>

                <div class="w-full max-w-5xl">
                    <img class="rounded-md" src="../imagenes/bloglaravel/Captura de pantalla 2026-05-01 084007.png">
                </div>

                <div class="w-full max-w-5xl">
                    <img class="rounded-md" src="../imagenes/bloglaravel/Captura de pantalla 2026-05-01 084026.png">
                </div>

            </div>

    </section>

    <section class="px-6 py-12 max-w-6xl md:py-30 mx-auto">

        <div class="text-center mb-10">
            <h2 class="text-3xl font-mono font-bold text-white">
                Tecnologias Utilizadas</h2>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-8 text-center items-center">

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/HTML5.png">
                <h3 class="text-xl font-bold text-white">HTML</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/php.png">
                <h3 class="text-xl font-bold text-white">PHP</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/Laravel.png">
                <h3 class="text-xl font-bold text-white">Laravel</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/Bootstrap.png">
                <h3 class="text-xl font-bold text-white">Bootstrap</h3>
            </div>

            <div class="flex flex-col items-center">
                <img class="h-16 w-auto mb-2" src="../frameworks/Javascript.png">
                <h3 class="text-xl font-bold text-white">JavaScript</h3>
            </div>

        </div>

    </section>
